{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script src="https://cdn.tailwindcss.com"></script>
      <title>Student Dashboard | Quizit</title>
</head>

<body>
      <header class="fixed top-0 w-full bg-purple-700 text-white">
            <!-- Top Header -->
            <div class="mx-auto flex justify-between items-center px-6 py-4">
                  <a href="/student_dashboard">
                        <h1 class="text-2xl font-bold hidden md:block">Student Dashboard</h1>
                  </a>
                  <nav>
                        <ul class="flex space-x-6">
                              <li><a href="#"
                                          class="py-2 px-6 bg-white/20 rounded-lg hover:bg-white/40 hover:text-purple-800 transition duration-300">500
                                          points</a></li>
                              <li><a href="user_dashboard/"
                                          class="py-2 px-6 bg-white/20 rounded-lg hover:bg-white/40 hover:text-purple-800 transition duration-300">User's
                                          Dashboard</a></li>
                        </ul>
                  </nav>
            </div>

            <!-- Bottom Header -->
            <div class="flex justify-between items-center px-6 py-4 border-t-2 border-white/30">
                  <h1 class="text-2xl font-bold">Yummy Quiz</h1>
                  <form action="{% url 'login_view' %}" method="POST">
                        {% csrf_token %}
                        <button type="submit"
                              class="bg-white text-purple-600 px-6 py-2 rounded-lg font-semibold hover:bg-gray-100 transition duration-300">
                              Logout
                        </button>
                  </form>
            </div>
      </header>


      <main class=" mx-auto ">
            <!-- Class Joining -->
            <section id="class-joining" class="flex items-center justify-center min-h-screen p-8  shadow-md">
                  <div>
                        <form method="POST" action="{% url 'join_class' %}">
                              {% csrf_token %}
                              <input type="text" name="class_code" placeholder="Enter Join Code" required>
                              <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg"
                                    style="background-color: #F3BB00;">
                                    Join Class
                              </button>
                        </form>

                        <img class="masthead-avatar mb-5 size-40" src="{% static 'assets/pic.png' %}" alt="">
                  </div>
            </section>
      </main>
</body>

</html>
