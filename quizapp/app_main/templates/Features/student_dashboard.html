{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="{% static 'assets/icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/studentdashboard_style.css' %}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Student Dashboard | Quizit</title>
</head>

<body>
    <div class="main-container">
        <div class="right-side">
            <nav class=" text-black">
                <div class="max-w-7xl mx-auto px-4 sm:">
                    <div class="flex justify-between items-center h-16">
                        <!-- Logo -->
                        <div class="flex flex-col">
                            <a href="#" class="text-lg font-bold">Dashboard</a>
                            <a href="">Monday, December 29 2022</a>
                        </div>
                        <!-- Links (Hidden on smaller screens) -->
                        <div class="hidden md:flex space-x-4 items-center">
                            <img class="masthead-avatar"
                                style="border-radius: 50%; background-color: white; border: 3px solid #24724D;"
                                src="{% static 'assets/Profile.jpg' %}" alt="" width="55px">
                                <a href="" class=""> Mikhail Villanueva</a>
                        </div>
                    </div>
                </div>
            </nav>


            <main class="max-w-7xl mx-auto px-4 sm:">
                <!-- Class Joining -->
                <section id="class-joining">
                    <div class="">
                        <div class="flex items-center gap-20">

                            <form method="POST" action="{% url 'join_class' %}" class="flex gap-6">
                                {% csrf_token %}
                                <input type="text" name="class_code" placeholder="Enter Join Code" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 bg-gray-200">
                                <button type="submit" class="bg-blue-600 text-white px-10 py-2 rounded-lg"
                                    style="background-color: #F3BB00; width: 200px;">
                                    Join Class
                                </button>
                            </form>
                            <div>
                                <img class="masthead-avatar  size-40" src="{% static 'assets/pic.png' %}" alt="">
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <nav class="sidebar">
            <div class="sidebar-content">
                <div class="sidebar-top-content">

                    <!------SIKHAY LOGO-->
                    <div class="sikhay-logo">
                        <img src="{% static 'assets/logo_white.png' %}" alt="" width="200px">
                    </div>

                </div>
            </div>

            <div class="menu-bar text-white">
                <div class="menu">
                    <ul class="menu-links space-y-4">
                        <!-- Home -->
                        <li class="nav-link">
                            <button onclick="window.location.href='Main_Page.html'"
                                class="flex items-center space-x-2 p-2 rounded-md hover:bg-gray-700 w-full text-left">
                                <i class="bx bxs-dashboard icon text-lg"></i>
                                <span class="text nav-text">Home</span>
                            </button>
                        </li>
                        <!-- Classes -->
                        <li class="nav-link">
                            <button onclick="window.location.href='Student_Display.html'"
                                class="flex items-center space-x-2 p-2 rounded-md hover:bg-gray-700 w-full text-left">
                                <i class="bx bxs-user-account icon text-lg"></i>
                                <span class="text nav-text">Classes</span>
                            </button>
                        </li>
                    </ul>
                </div>

                <div class="bottom-content mt-8">
                    <ul class="menu-links space-y-4">
                        <!-- Logout -->
                        <li>
                            <form action="{% url 'login_view' %}" method="POST"
                                class="flex items-center space-x-2 p-2 rounded-md hover:bg-gray-700">
                                {% csrf_token %}
                                <button type="submit"
                                    class="flex items-center space-x-2 text-white focus:outline-none w-full text-left">
                                    <i class="bx bx-log-out icon text-lg"></i>
                                    <span class="text nav-text">Logout</span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>

        </nav>
    </div>

</body>

</html>
