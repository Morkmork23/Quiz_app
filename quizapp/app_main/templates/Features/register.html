{% load static %}
<!DOCTYPE html>

<html lang="en">


<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- if you just want css only -->
      <link rel="stylesheet" href="{% static 'css/colors.css' %}">
      <link rel="stylesheet" href="{% static 'css/login.css' %}">
      <link rel="icon" href="{% static 'assets/icon.png' %}">

      <!-- if you want bootstrap 5 -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"
            defer></script>
      <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
      <title>Sign up | Quizit</title>
      <style>
            .radio-container {
                  display: flex;
                  gap: 15px;
                  border: 1px solid #ced4da;
                  padding: 7px;
                  border-radius: 8px;
                  background-color: #ffffff;
                  font-size: 12px;
            }

            .radio-container input {
                  accent-color: #000;
            }

            body {
                  overflow-x: hidden;
                  /* Completely disables scrolling */
                  overflow-y: scroll;
            }
      </style>
</head>


<body style="background-color: #3E1847;">
      <section>
            <div class="container" style="background-color: #3E1847; box-shadow: none;">
                  <div class="row d-flex justify-content-center align-items-center vh-100">
                        <div class="col-xl-8">
                              <div class="card" style="border-radius: 1rem; border: none;">
                                    <div class="row g-0">
                                          <!-- Left Column -->
                                          <div class="col-md-6 d-flex flex-column align-items-center justify-content-center position-relative d-none d-md-block"
                                                style="border-radius: 1rem 0 0 1rem; background-color: #6A1B9A;">
                                                <!-- Absolute Heading -->
                                                <div class="position-absolute text-white text-center w-100"
                                                      style="top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;">
                                                      <h1 style="font-size: 2.8rem; font-weight: bold;">Join Us Today!
                                                      </h1>
                                                      <p style="font-size: 1.2rem; margin-top: 10px;">
                                                            Create your account now and unlock access to a world of
                                                            learning and opportunities.
                                                      </p>
                                                </div>


                                                <!-- Logo -->
                                                <img src="{% static 'assets/logo_white.png' %}" alt="Logo" width="150px"
                                                      class="position-absolute" style="top: 20px; left: 20px;">

                                                <!-- Background Image -->
                                                <img src="{% static 'assets/purplebackground.png' %}" alt="login form"
                                                      class="img-fluid h-100 w-100"
                                                      style="border-radius: 1rem 0 0 1rem; object-fit: cover;">
                                          </div>

                                          <!-- Right Column -->
                                          <div class="col-md-6 d-flex align-items-center justify-content-center">
                                                <div class="card-body text-black p-4 w-100">
                                                      <form action="" method="POST">
                                                            {% csrf_token %}
                                                            <div class="mb-3 pb-1 text-start">
                                                                  <h1 class="fw-bold mb-0" style="color: #333333;">Sign
                                                                        Up</h1>
                                                            </div>

                                                            <h5 class="fw-normal pb-3 text-start"
                                                                  style="letter-spacing: 1px;">
                                                                  Enter your details to create an account.
                                                            </h5>

                                                            <!-- User Type -->
                                                            <div class="mb-4">
                                                                  <label class="form-label mb-3 lead"
                                                                        style="font-size: 20px; font-weight: 500;">User
                                                                        Type</label>
                                                                  <div class="d-flex justify-content-center">
                                                                        <div class="form-check mx-3">
                                                                              <input class="form-check-input"
                                                                                    type="radio" name="userType"
                                                                                    id="student" value="student">
                                                                              <label class="form-check-label"
                                                                                    for="student">Student</label>
                                                                        </div>
                                                                        <div class="form-check mx-3">
                                                                              <input class="form-check-input"
                                                                                    type="radio" name="userType"
                                                                                    id="teacher" value="teacher">
                                                                              <label class="form-check-label"
                                                                                    for="teacher">Teacher</label>
                                                                        </div>
                                                                  </div>
                                                            </div>

                                                            <!-- Input Fields -->
                                                            <div class="mb-3">
                                                                  <label for="name"
                                                                        class="form-label mb-0 text-muted">Name</label>
                                                                  <input type="text"
                                                                        class="form-control form-control-lg" id="name"
                                                                        name="name" placeholder="Enter your Full Name"
                                                                        required>
                                                            </div>

                                                            <div class="mb-3">
                                                                  <label for="username"
                                                                        class="form-label mb-0 text-muted">Username</label>
                                                                  <input type="text"
                                                                        class="form-control form-control-lg"
                                                                        id="username" name="username"
                                                                        placeholder="Enter your username" required>
                                                            </div>

                                                            <div class="mb-3">
                                                                  <label for="email"
                                                                        class="form-label mb-0 text-muted">Email</label>
                                                                  <input type="email"
                                                                        class="form-control form-control-lg" id="email"
                                                                        name="email" placeholder="Enter your email"
                                                                        required>
                                                            </div>

                                                            <div class="mb-3">
                                                                  <label for="password"
                                                                        class="form-label mb-0 text-muted">Password</label>
                                                                  <input type="password"
                                                                        class="form-control form-control-lg"
                                                                        id="password" name="password"
                                                                        placeholder="Enter your password" required>
                                                            </div>

                                                            <!-- Submit Button -->
                                                            <div class="d-flex justify-content-center">
                                                                  <button type="submit"
                                                                        class="btn btn-lg w-50 text-white"
                                                                        style="background-color: #BD5DD5;">Create
                                                                        Account</button>
                                                            </div>
                                                      </form>
                                                </div>
                                          </div>
                                    </div>
                              </div>
                        </div>
                  </div>

            </div>
      </section>
</body>

</html>
