{% load static %}
<!DOCTYPE html>

<html lang="en">


<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- if you just want css only -->
      <link rel="stylesheet" href="{% static 'css/colors.css' %}">
      <link rel="stylesheet" href="{% static 'css/login.css' %}">
      <link rel="icon" href="{% static 'assets/icon.png' %}">

      <!-- if you want bootstrap 5 -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"
            defer></script>
      <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
      <title>Log in</title>
      <style>
            .radio-container {
                  display: flex;
                  gap: 15px;
                  border: 1px solid #ced4da;
                  padding: 7px;
                  border-radius: 8px;
                  background-color: #ffffff;
                  font-size: 12px;
            }

            .radio-container input {
                  accent-color: #000;
            }
      </style>
</head>


<body style="background-color: #3E1847;">
      <section>
            <div class="container" style="background-color: #3E1847; box-shadow: none;">
                  <div class="row d-flex justify-content-center align-items-center h-100">
                        <div class="col col-xl-10">
                              <div class="card" style="border-radius: 1rem; border: none;">
                                    <div class="row g-0">
                                          <div class="col-md-6 col-lg-5 d-none d-md-block">
                                                <img src="{% static 'assets/logo_white.png' %}" alt="" width="200px"
                                                      style="position: absolute; margin: 20px 0px 0px 20px;">

                                                <img src="{% static 'assets/purplebackground.png' %}" alt="login form"
                                                      class="img-fluid"
                                                      style="border-radius: 1rem 0 0 1rem; height: 720px;" />
                                          </div>
                                          <div class="col-md-6 col-lg-7 d-flex align-items-center ">
                                                <div class="card-body text-black p-4">

                                                      <form action="" method="POST">
                                                            {% csrf_token %}
                                                            <div class="d-flex align-items-center mb-3 pb-1">
                                                                  <span class="h1 fw-bold mb-0"
                                                                        style="color: #333333;">Sign up</span>
                                                            </div>

                                                            <h5 class="fw-normal pb-3" style="letter-spacing: 1px;">
                                                                  Please input your details.
                                                            </h5>

                                                            <!-- User Type -->
                                                            <div class="mb-4">
                                                                  <label class="form-label mb-3 lead"
                                                                        style="font-size: 20px; font-weight: 500;">User
                                                                        type</label>
                                                                  <div class="radio-container ">
                                                                        <div class="form-check mb-0">
                                                                              <input class="form-check-input"
                                                                                    type="radio" name="userType"
                                                                                    id="student" value="student">
                                                                              <label class="form-check-label"
                                                                                    for="student">Student</label>
                                                                        </div>
                                                                        <div class="form-check mb-0">
                                                                              <input class="form-check-input"
                                                                                    type="radio" name="userType"
                                                                                    id="teacher" value="teacher">
                                                                              <label class="form-check-label"
                                                                                    for="teacher">Teacher</label>
                                                                        </div>
                                                                  </div>
                                                            </div>

                                                            <div class="">
                                                                  <label class="form-label mb-3 lead"
                                                                        style="font-size: 20px; font-weight: 500;">Details</label>
                                                                  <!-- Name -->
                                                                  <div class="mb-3">
                                                                        <label for="name"
                                                                              class="form-label mb-0 text-muted">Name</label>
                                                                        <input type="text"
                                                                              class="form-control form-control-lg"
                                                                              id="name" name="name"
                                                                              placeholder="Enter your Full Name"
                                                                              required>
                                                                  </div>


                                                                  <!-- Username -->
                                                                  <div class="mb-3">
                                                                        <label for="username"
                                                                              class="form-label mb-0 text-muted">Username</label>
                                                                        <input type="text"
                                                                              class="form-control form-control-lg"
                                                                              id="username" name="username"
                                                                              placeholder="Enter your username"
                                                                              required>
                                                                  </div>

                                                                  <!-- Email -->
                                                                  <div class="mb-3">
                                                                        <label for="email"
                                                                              class="form-label mb-0 text-muted">Email</label>
                                                                        <input type="email"
                                                                              class="form-control form-control-lg"
                                                                              id="email" name="email"
                                                                              placeholder="Enter your email" required>
                                                                  </div>

                                                                  <!-- Password -->
                                                                  <div class="mb-3">
                                                                        <label for="password"
                                                                              class="form-label mb-0 text-muted">Password</label>
                                                                        <input type="password"
                                                                              class="form-control form-control-lg"
                                                                              id="password" name="password"
                                                                              placeholder="Enter your password"
                                                                              required>
                                                                  </div>

                                                                  <!-- Submit Button -->
                                                                  <div class="pt-1 d-flex justify-content-center">
                                                                        <button type="submit"
                                                                              class="btn btn-dark btn-lg w-40"
                                                                              type="submit"
                                                                              style="width: 40%; background-color: #BD5DD5;">Create
                                                                              Account</button>
                                                                  </div>
                                                            </div>
                                                      </form>


                                                </div>
                                          </div>
                                    </div>
                              </div>
                        </div>
                  </div>
            </div>
      </section>
</body>

</html>
